name: Docs checks

# Validate every change before the production Cloudflare Pages deployment.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build search index and sitemap
        run: node scripts/build-search-index.js
      - name: Links, metadata and OpenAPI structure
        run: npm run check
      - name: Docs vs OpenAPI drift
        run: npm run check:drift -- --strict

  # Signals when api-reference/routes.snapshot.json no longer matches the
  # backend's main branch. Advisory: backend commits should not block docs CI.
  routes-snapshot:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Victor-Kipruto-Rop/api.pesaguard.victorkipruto.com
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        # jsonschema is imported by the backend but missing from its
        # requirements.txt (the backend CI installs it separately).
        run: |
          pip install -r backend/pesaguard_backend_pipeline/requirements.txt
          pip install jsonschema==4.23.0
      - name: Regenerate route snapshot
        env:
          DATABASE_URL: sqlite:////tmp/pesaguard-docs-check.db
          PESAGUARD_API_URL: https://api.pesaguard.co.ke
        run: python scripts/dump-flask-routes.py backend --out /tmp/routes.json
      - name: Compare routes with the committed snapshot
        run: |
          python - <<'PY'
          import json
          a = json.load(open("/tmp/routes.json"))["routes"]
          b = json.load(open("api-reference/routes.snapshot.json"))["routes"]
          if a != b:
              raise SystemExit("routes.snapshot.json is stale: regenerate with scripts/dump-flask-routes.py")
          print("route snapshot is current")
          PY
      - name: Compare openapi.json with a fresh build
        env:
          DATABASE_URL: sqlite:////tmp/pesaguard-docs-check.db
          PESAGUARD_API_URL: https://api.pesaguard.co.ke
        run: |
          python scripts/generate-openapi.py backend --out /tmp/openapi.json
          python - <<'PY'
          import json
          def load(p):
              d = json.load(open(p))
              d["info"].get("x-generated-from", {}).pop("commit", None)  # commit stamp is not content
              return d
          if load("/tmp/openapi.json") != load("api-reference/openapi.json"):
              raise SystemExit("openapi.json is stale: run scripts/generate-openapi.py (or merge the sync PR)")
          print("openapi.json is current")
          PY

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build search index and sitemap
        run: node scripts/build-search-index.js

      - name: Stage public documentation files
        run: |
          mkdir -p "$RUNNER_TEMP/docs-site"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='components/' \
            --exclude='CNAME' \
            --exclude='README.md' \
            --exclude='package.json' \
            ./ "$RUNNER_TEMP/docs-site/"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is required"; exit 1; }
          npx --yes wrangler@4 pages deploy "$RUNNER_TEMP/docs-site" \
            --project-name=docs-pesaguard \
            --branch=main
